name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:server && npm run typecheck:functions && npm run typecheck:convex
      - run: npm run fixture:validate
      - run: npm run audit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser and accessibility checks
        run: |
          npm exec vite preview -- --host 127.0.0.1 --port 4173 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4173 > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: artifacts/browser
