<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Jev — Dynamic insights from your data.</title>
    <meta name="description" content="Turn your CSV into a dashboard worth sharing. Explore maps, discover patterns, and replay the story with Jev." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jev Data Analysis" />
    <meta property="og:title" content="Jev — Dynamic insights from your data." />
    <meta property="og:description" content="Turn a table of rows into a dashboard worth sharing. Explore the free examples, then bring your own CSV." />
    <meta property="og:image" content="/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jev: Dynamic insights from your data, with a preview of a trend chart." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/social-card.png" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('jev-theme')
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored === 'light' || stored === 'dark' ? stored : (systemDark ? 'dark' : 'light')
          var root = document.documentElement
          root.classList.toggle('dark', theme === 'dark')
          if (stored === 'light' || stored === 'dark') root.setAttribute('data-theme', stored)
          else root.removeAttribute('data-theme')
          root.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
